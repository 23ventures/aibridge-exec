name: ci
# Pull requests and branch pushes run this directly; main runs it through deploy.yml.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: lint-imports
      - run: pytest --cov --cov-report=term-missing
