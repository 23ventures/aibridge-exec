# Test, build and deploy to ECS on every push to main. Setup: "AIBridge on AWS: setup and CI/CD".
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # GitHub OIDC -> AWS role, no stored AWS keys

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aibridge' }}
      IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/aibridge-exec:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Check whether this commit's image already exists
        id: image
        run: |
          # ECR tags are immutable: a re-run of the same commit reuses the image it already pushed.
          TAG=$(aws ecr batch-get-image --repository-name aibridge-exec --image-ids imageTag=${{ github.sha }} \
            --query 'images[0].imageId.imageTag' --output text)
          if [ "$TAG" = "${{ github.sha }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ${{ github.sha }} is already in ECR: skipping the build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push the image
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Fill in the task definition
        run: envsubst '$AWS_ACCOUNT_ID $AWS_REGION' < deploy/ecs/exec.json > task-definition.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: exec
          image: ${{ env.IMAGE }}
      - name: Deploy and wait until healthy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: exec
          wait-for-service-stability: true
