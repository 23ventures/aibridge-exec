[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aibridge-exec"
version = "0.2.0"
description = "Stateless execution layer for AIBridge: LLM provider adapters, an optional HTTP server, boundary contracts and a code runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["packaging>=23", "httpx>=0.27,<1"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "pytest-cov>=5", "import-linter>=2.0", "fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
aibridge-exec = "aibridge_exec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["aibridge_exec"]
